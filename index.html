<script>
    const head = document.getElementById('header');
    window.addEventListener('scroll', (e) => {
        if (window.pageYOffset > 10) {
            head.classList.add("QKrU5e");
        } else {
            head.classList.remove("QKrU5e");
        }
    });

    // Games / Apps tabs
    const tabs = {
        games: {button: document.getElementById('11'), panel: document.getElementById('gamesPanel')},
        apps: {button: document.getElementById('1'), panel: document.getElementById('appsPanel')}
    };

    function showTab(name) {
        for (const key in tabs) {
            const active = key === name;
            const {button, panel} = tabs[key];
            button.classList.toggle('VfPpkd-AznF2e-OWXEXe-auswjd', active);
            button.querySelector('.VfPpkd-AznF2e-uDEFge').classList.toggle('VfPpkd-AznF2e-uDEFge-OWXEXe-auswjd', active);
            button.setAttribute('aria-selected', active);
            button.tabIndex = active ? 0 : -1;
            panel.hidden = !active;
        }
        window.scrollTo(0, 0);
    }

    for (const key in tabs) {
        tabs[key].button.addEventListener('click', () => showTab(key));
    }

</script>
