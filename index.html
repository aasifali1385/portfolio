<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>Android Apps by Aasif Ali</title>

    <link rel="shortcut icon" href="//www.gstatic.com/android/market_images/web/favicon_v3.ico">

    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&family=Roboto:wght@400;500&display=swap">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/preview.css">
    <link rel="stylesheet" href="css/resume.css">
    <script src="js/header.js"></script>
    <script src="js/app-card.js"></script>
    <script src="js/resume.js"></script>
</head>

<body>

<script>renderHeader({root: './', tab: 'apps'});</script>

<!-- Games tab: one file per developer section, shown in this order -->
<div id="gamesPanel" hidden>
    <script src="js/games/mindtap-studios.js"></script>
</div>

<!-- Apps tab: one file per developer section, shown in this order -->
<div id="appsPanel">
    <script src="js/apps/henry-harvin.js"></script>
    <script src="js/apps/parcelwalla.js"></script>
    <script src="js/apps/duplex-technologies.js"></script>
    <script src="js/apps/codeon-infosystem.js"></script>
    <script src="js/apps/mindtap-labs.js"></script>
    <script src="js/apps/others.js"></script>
</div>

<!-- About Me tab: your details are in js/resume-details.js -->
<div id="aboutPanel" hidden>
    <script src="js/resume-details.js"></script>
</div>

<script>
    // Games / Apps / About Me tabs
    const tabs = {
        games: {button: document.getElementById('gamesTab'), panel: document.getElementById('gamesPanel')},
        apps: {button: document.getElementById('appsTab'), panel: document.getElementById('appsPanel')},
        about: {button: document.getElementById('aboutTab'), panel: document.getElementById('aboutPanel')}
    };

    function showTab(name) {
        for (const key in tabs) {
            const active = key === name;
            const {button, panel} = tabs[key];
            button.classList.toggle('VfPpkd-AznF2e-OWXEXe-auswjd', active);
            button.querySelector('.VfPpkd-AznF2e-uDEFge').classList.toggle('VfPpkd-AznF2e-uDEFge-OWXEXe-auswjd', active);
            button.setAttribute('aria-selected', active);
            button.tabIndex = active ? 0 : -1;
            panel.hidden = !active;
        }
        window.scrollTo(0, 0);
    }

    for (const key in tabs) {
        tabs[key].button.addEventListener('click', () => showTab(key));
    }

    // Preview pages link back with #games or #about to open that tab (#resume still works)
    const startTab = location.hash.slice(1) === 'resume' ? 'about' : location.hash.slice(1);
    if (startTab in tabs) showTab(startTab);
</script>

</body>

</html>
